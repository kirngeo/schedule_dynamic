refresh_schedule:
  target:
    entity:
      domain: schedule
  fields:
    offset:
      required: true
      default:
        days: 0
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:
          allow_negative: true
          min:
            minutes: -360
          max:
            minutes:  360
